<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follow the Money — Dados</title>
  <meta name="description" content="Gráficos do IPCA atualizados automaticamente com dados do BCB e do IBGE.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // Tema antes da pintura (sem piscar). Padrão: escuro, como os gráficos do FtM.
    (function () {
      var t = "dark";
      try {
        var s = localStorage.getItem("ftm_dados_tema");
        if (s === "light" || s === "dark") t = s;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Follow the Money">
        <span class="logo" id="logo-topo" aria-hidden="true"></span>
        <span class="brand-tag">Dados · IPCA</span>
      </a>
      <button type="button" class="icon-btn" id="tema" aria-label="Alternar modo escuro" title="Alternar modo escuro">
        <svg class="ico-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-lua" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="Seções"></nav>
  </header>

  <main id="graficos" class="graficos" aria-live="polite">
    <p class="estado">Carregando gráficos…</p>
  </main>

  <footer class="rodape" id="rodape"></footer>
  <script src="app.js"></script>
</body>
</html>
