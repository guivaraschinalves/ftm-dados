name: Atualiza os dados

on:
  schedule:
    # 12:30 e 20:00 UTC (09:30 e 17:00 em Brasília), todo dia. O IPCA sai às
    # 9h no dia da divulgação; a segunda rodada pega o SGS quando ele atrasa.
    - cron: "30 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Só biblioteca padrão: nada para instalar.
      - name: Baixa as séries e refaz as contas
        run: python scripts/atualizar.py

      - name: Commita, se algum número mudou
        run: |
          if git diff --quiet -- dados; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git commit -m "Atualiza os dados do IPCA"
          git push
