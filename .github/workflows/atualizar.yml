name: Atualiza os dados

on:
  schedule:
    # 12:30 e 20:00 UTC (09:30 e 17:00 em Brasília), todo dia. O IPCA sai às
    # 9h no dia da divulgação; a segunda rodada pega o SGS quando ele atrasa.
    - cron: "30 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Só biblioteca padrão: nada para instalar.
      - name: IPCA — baixa as séries e refaz as contas
        run: python scripts/atualizar.py

      # Estatísticas fiscais: o BC divulga uma vez por mês, no fim da tarde.
      - name: Fiscal — resultado primário (SGS)
        run: python scripts/fiscal.py

      # Balanço de pagamentos: a tabela especial BalPagM.xlsx do BC, mais
      # câmbio e PIB em dólar do SGS. Sai uma vez por mês, perto do dia 25.
      - name: Balanço de Pagamentos — tabela do BC e SGS
        run: python scripts/bp.py

      # O CSV do Tesouro Transparente muda em dia útil, de manhã.
      - name: Tesouro Direto — taxas por prazo
        run: python scripts/tesouro_direto.py

      # Depende do passo de cima: a NTN-B 2050 sai de dados/tesouro-direto.json,
      # para que o mesmo papel não apareça com duas taxas em dois cartões.
      - name: Juros — Brasil e EUA (Tesouro, SGS e FRED)
        run: python scripts/juros.py

      # Entrou na Action por causa dos leilões, que andam todo pregão. O resto
      # da categoria vem do Relatório Mensal da Dívida, que é mensal e chega à
      # mão — rodar todo dia só reescreve os mesmos números.
      - name: Dívida Pública — leilões do Tesouro (e o resto do relatório)
        run: python scripts/divida.py

      # A imagem e a página de prévia de cada gráfico (c/), para o post no X
      # e no LinkedIn mostrar o gráfico. Só refaz o gráfico cujos números
      # mudaram; usa o google-chrome que já vem no runner.
      - name: Prévias para compartilhar (c/)
        run: python scripts/cartoes.py

      - name: Commita, se algum número mudou
        run: |
          if git diff --quiet -- dados c && [ -z "$(git status --porcelain -- c)" ]; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados c
          git commit -m "Atualiza os dados"
          git push
